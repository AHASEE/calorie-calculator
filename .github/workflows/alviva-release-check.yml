name: Alviva Release Check

on:
  push:
    branches:
      - main
    paths:
      - "CalorieApp/**"
      - ".github/workflows/alviva-release-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CalorieApp

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: CalorieApp/package-lock.json

      - name: Refresh Expo dependency lockfile
        run: npm install --package-lock-only

      - name: Apply safe npm audit fixes
        run: npm audit fix --package-lock-only || true

      - name: Commit lockfile updates if needed
        working-directory: .
        run: |
          if git diff --quiet -- CalorieApp/package-lock.json; then
            echo "Lockfile already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CalorieApp/package-lock.json
            git commit -m "Refresh audited dependency lockfile"
            git push
          fi

      - name: Install dependencies
        run: npm ci

      - name: NPM audit report
        run: npm audit --audit-level=high || true

      - name: Expo Doctor
        run: npx --yes expo-doctor

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Android JavaScript bundle
        env:
          EXPO_PUBLIC_API_URL: https://calorie-calculator-4ls7.onrender.com
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npx expo export --platform android --output-dir dist
